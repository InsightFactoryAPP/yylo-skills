name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repository and invocation contracts
        run: node scripts/validate.mjs
      - name: Test nested lifecycle regressions
        run: node --test scripts/validate.test.mjs
      - name: Verify skills CLI discovery
        run: npx --yes skills add . --list
